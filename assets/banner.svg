<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#101935" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2942" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="neonPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes floatPill {
      0% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-10px) scale(1.02); }
      100% { transform: translateY(0px) scale(1); }
    }
    @keyframes floatPillRev {
      0% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(10px) scale(0.98); }
      100% { transform: translateY(0px) scale(1); }
    }
    @keyframes pulseRing {
      0% { transform: scale(0.98); opacity: 0.3; }
      50% { transform: scale(1.03); opacity: 0.7; }
      100% { transform: scale(0.98); opacity: 0.3; }
    }
    @keyframes shimmerMove {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .pill-1 { animation: floatPill 6s ease-in-out infinite; }
    .pill-2 { animation: floatPillRev 7s ease-in-out infinite; }
    .pill-3 { animation: floatPill 8s ease-in-out infinite 1s; }
    .pill-4 { animation: floatPillRev 6.5s ease-in-out infinite 0.5s; }
    .pulse-bg { animation: pulseRing 5s ease-in-out infinite; transform-origin: center; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Decorative Rings / Glow in background -->
  <g class="pulse-bg">
    <circle cx="200" cy="80" r="140" fill="#3b82f6" opacity="0.08" filter="url(#glow)" />
    <circle cx="1000" cy="250" r="160" fill="#8b5cf6" opacity="0.09" filter="url(#glow)" />
    <circle cx="600" cy="170" r="220" fill="#ec4899" opacity="0.05" filter="url(#glow)" />
  </g>

  <!-- Subtle Grid Pattern in background -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.04">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" />
    <path d="M 150,0 L 150,340 M 300,0 L 300,340 M 450,0 L 450,340 M 600,0 L 600,340 M 750,0 L 750,340 M 900,0 L 900,340 M 1050,0 L 1050,340" />
  </g>

  <!-- Interactive/Dynamic Floating Component Badges (Background/Sides) -->
  <g class="pill-1" transform="translate(80, 50)">
    <rect width="170" height="36" rx="18" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="20" cy="18" r="5" fill="#38bdf8" />
    <text x="34" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🎭 Playwright CT</text>
  </g>

  <g class="pill-2" transform="translate(950, 45)">
    <rect width="180" height="36" rx="18" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="20" cy="18" r="5" fill="#ec4899" />
    <text x="34" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🐙 Testing Library</text>
  </g>

  <g class="pill-3" transform="translate(70, 250)">
    <rect width="175" height="36" rx="18" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="20" cy="18" r="5" fill="#10b981" />
    <text x="34" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🌲 Cypress Mount</text>
  </g>

  <g class="pill-4" transform="translate(960, 255)">
    <rect width="165" height="36" rx="18" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="20" cy="18" r="5" fill="#f59e0b" />
    <text x="34" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">⚡ Vitest Browser</text>
  </g>

  <!-- Center Foreground Title & Subtitle Container (Always in Crisp Foreground) -->
  <g transform="translate(600, 100)" text-anchor="middle">
    <!-- Super Title Tag -->
    <rect x="-140" y="-30" width="280" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="0" y="-13" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">🚀 AWESOME ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="42" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#softGlow)">Awesome Component Testing</text>
    <text x="0" y="42" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">Awesome Component Testing</text>

    <!-- Subtitle -->
    <text x="0" y="82" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400">Curated Architecture of UI Component Testing, Visual Regression &amp; Accessibility Libraries</text>

    <!-- Category Flow Line / Feature Pills -->
    <g transform="translate(0, 115)">
      <rect x="-240" y="0" width="110" height="24" rx="12" fill="#1e293b" opacity="0.9" stroke="#334155" stroke-width="1" />
      <text x="-185" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">⚡ Fast DOM</text>

      <rect x="-115" y="0" width="110" height="24" rx="12" fill="#1e293b" opacity="0.9" stroke="#334155" stroke-width="1" />
      <text x="-60" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">🌐 Real Browser</text>

      <rect x="10" y="0" width="110" height="24" rx="12" fill="#1e293b" opacity="0.9" stroke="#334155" stroke-width="1" />
      <text x="65" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">👁️ Visual Diffs</text>

      <rect x="135" y="0" width="110" height="24" rx="12" fill="#1e293b" opacity="0.9" stroke="#334155" stroke-width="1" />
      <text x="190" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">♿ Accessibility</text>
    </g>
  </g>
</svg>
